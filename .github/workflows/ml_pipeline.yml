name: Monitoring CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  monitoring-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    # ✅ Run lightweight monitoring validation (NO DB)
    - name: Validate Monitoring Scripts
      run: |
        echo "Running monitoring validation..."
        python 04_monitoring/scripts/detect_data_drift.py || echo "Skipped data drift"
        python 04_monitoring/scripts/detect_prediction_drift.py || echo "Skipped prediction drift"
        python 04_monitoring/scripts/detect_performance_drift.py || echo "Skipped performance drift"