name: Advanced MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - test-production-cicd

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monitoring_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

    # 1. Checkout repository
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Setup Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Install dependencies
    - name: Install Dependencies
      run: |
        pip install pandas psycopg2-binary

    # 4. Show project structure (DEBUG + PROOF)
    - name: Show Project Structure
      run: |
        echo "Listing project files:"
        ls -R

    # 5. Basic Code Validation
    - name: Validate Script Execution
      run: |
        echo "Running CI monitoring script..."
        python ci_monitor.py

    # 6. Wait for PostgreSQL
    - name: Wait for PostgreSQL
      run: sleep 10

    # 7. Database Connection Check (Safe)
    - name: Validate Database Connection
      run: |
        echo "Checking DB connection..."
        python ci_monitor.py

    # 8. Final Status
    - name: CI Pipeline Status
      run: |
        echo "CI pipeline completed successfully"
        echo "System validated: data + database + execution"

    # 9. CD Ready Step (Simulation)
    - name: Deployment Ready Step
      run: |
        echo "System is container-ready and can be deployed using Docker"