name: Production Monitoring CI/CD Pipeline

on:
  push:
    branches:
      - main
      - test-production-cicd

jobs:
  monitoring-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monitoring_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Setup Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        pip install pandas psycopg2-binary

    # 4. Wait for PostgreSQL to be ready
    - name: Wait for PostgreSQL
      run: sleep 10

    # 5. Run monitoring script
    - name: Run Monitoring Pipeline
      run: |
        python 04_monitoring/scripts/ci_monitor.py