name: Advanced MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - test-production-cicd

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monitoring_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Setup Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        pip install pandas psycopg2-binary

    # 4. Code validation (syntax check)
    - name: Validate Python Code
      run: |
        python -m py_compile ci_monitor.py

    # 5. Data validation
    - name: Validate Data
      run: |
        if [ ! -f "04_monitoring/data/current_batches/new_data.csv" ]; then
          echo "Data file missing!"
          exit 1
        fi
        echo "Data file exists"

    # 6. Wait for DB
    - name: Wait for PostgreSQL
      run: sleep 10

    # 7. Run monitoring validation
    - name: Run Monitoring Validation
      run: |
        python ci_monitor.py

    # 8. CD-ready step (simulation)
    - name: Deployment Simulation
      run: |
        echo "System ready for deployment (Docker/CD can be added here)"