name: Monitoring CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  monitoring-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Monitoring Script
      run: |
        python 04_monitoring/scripts/monitor.py

    - name: Run Data Drift Detection
      run: |
        python 04_monitoring/scripts/detect_data_drift.py

    - name: Run Prediction Drift Detection
      run: |
        python 04_monitoring/scripts/detect_prediction_drift.py

    - name: Run Performance Drift Detection
      run: |
        python 04_monitoring/scripts/detect_performance_drift.py