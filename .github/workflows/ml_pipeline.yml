name: Monitoring CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  monitoring-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install -r requirements.txt

    # ✅ SAFE VALIDATION (ONLY CHECK FILES)
    - name: Check Monitoring Files
      run: |
        echo "Checking monitoring pipeline files..."

        test -f 04_monitoring/scripts/monitor.py
        test -f 04_monitoring/scripts/detect_data_drift.py
        test -f 04_monitoring/scripts/detect_prediction_drift.py
        test -f 04_monitoring/scripts/detect_performance_drift.py

        echo "All monitoring scripts exist ✅"