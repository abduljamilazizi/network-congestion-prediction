name: Monitoring CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  monitoring-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Setup Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Install required dependencies
    - name: Install dependencies
      run: |
        pip install pandas

    # 4. Run monitoring pipeline (CI/CD safe)
    - name: Run Monitoring Pipeline
      run: |
        python 04_monitoring/scripts/ci_monitor.py